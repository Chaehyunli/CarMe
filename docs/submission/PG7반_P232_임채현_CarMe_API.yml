openapi: 3.1.0
info:
  title: CarMe API
  summary: 선택 차량 매뉴얼 기반 RAG 상담 API
  description: 차량 선택으로 적용 매뉴얼을 결정하고, 매뉴얼 내부의 목차 섹션과 페이지 청크를 검색해 근거 기반 답변을 반환합니다. 이 OpenAPI YAML이 최신 API 계약의 기준입니다.
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - system
      summary: API 상태 확인
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/vehicle-catalog:
    get:
      tags:
      - vehicles
      summary: 등록 가능한 차량 카탈로그 조회
      description: Expose display values only; internal object-storage details never join this response.
      operationId: list_vehicle_catalog_api_v1_vehicle_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VehicleCatalogResponse'
                type: array
                title: Response List Vehicle Catalog Api V1 Vehicle Catalog Get
  /api/v1/vehicles:
    get:
      tags:
      - vehicles
      summary: List My Vehicles
      operationId: list_my_vehicles_api_v1_vehicles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserVehicleResponse'
                type: array
                title: Response List My Vehicles Api V1 Vehicles Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - vehicles
      summary: Add My Vehicle
      operationId: add_my_vehicle_api_v1_vehicles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserVehicleCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVehicleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/chat-sessions:
    post:
      tags:
      - chat-sessions
      summary: Start Chat
      operationId: start_chat_api_v1_chat_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/chat-sessions/{session_id}/manuals:
    get:
      tags:
      - chat-sessions
      summary: List Session Manuals
      operationId: list_session_manuals_api_v1_chat_sessions__session_id__manuals_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatManualResponse'
                title: Response List Session Manuals Api V1 Chat Sessions  Session Id  Manuals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat-sessions/{session_id}/manuals/{manual_id}/download-url:
    post:
      tags:
      - chat-sessions
      summary: Download Url
      operationId: download_url_api_v1_chat_sessions__session_id__manuals__manual_id__download_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: manual_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manual Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat-sessions/{session_id}/messages:
    post:
      tags:
      - chat-sessions
      summary: Send Message
      operationId: send_message_api_v1_chat_sessions__session_id__messages_post
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat-sessions/{session_id}:
    delete:
      tags:
      - chat-sessions
      summary: Close Chat
      operationId: close_chat_api_v1_chat_sessions__session_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/kakao/start:
    get:
      tags:
      - auth
      summary: 카카오 로그인 시작
      operationId: start_kakao_login_api_v1_auth_kakao_start_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/kakao/callback:
    get:
      tags:
      - auth
      summary: 카카오 로그인 콜백
      operationId: kakao_callback_api_v1_auth_kakao_callback_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/access-token:
    post:
      tags:
      - auth
      summary: access JWT 발급
      operationId: issue_access_token_api_v1_auth_access_token_post
      parameters:
      - name: carme_refresh_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Carme Refresh Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: 현재 사용자 조회
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/onboarding:
    post:
      tags:
      - auth
      summary: 첫 로그인 역할 선택
      operationId: complete_onboarding_api_v1_auth_onboarding_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 로그아웃
      operationId: logout_api_v1_auth_logout_post
      parameters:
      - name: carme_refresh_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Carme Refresh Token
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/vehicle-catalog:
    get:
      tags:
      - admin-vehicle-catalog
      summary: List Admin Catalogs
      operationId: list_admin_catalogs_api_v1_admin_vehicle_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminVehicleCatalogResponse'
                type: array
                title: Response List Admin Catalogs Api V1 Admin Vehicle Catalog Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - admin-vehicle-catalog
      summary: Create Admin Catalog
      operationId: create_admin_catalog_api_v1_admin_vehicle_catalog_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleCatalogCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleCatalogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/vehicle-catalog/{catalog_id}:
    patch:
      tags:
      - admin-vehicle-catalog
      summary: Update Admin Catalog
      operationId: update_admin_catalog_api_v1_admin_vehicle_catalog__catalog_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Catalog Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleCatalogUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleCatalogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin-vehicle-catalog
      summary: Archive Admin Catalog
      operationId: archive_admin_catalog_api_v1_admin_vehicle_catalog__catalog_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Catalog Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/vehicle-catalog/{catalog_id}/official-manual-url:
    patch:
      tags:
      - admin-vehicle-catalog
      summary: Update Catalog Official Manual Url
      description: 'Save an admin-verified Hyundai manual root URL for any live catalog.


        This is navigation metadata, not a request to scrape protected web pages.

        It deliberately remains editable after the representative PDF activates a

        catalog because Hyundai may change a web-manual route independently.'
      operationId: update_catalog_official_manual_url_api_v1_admin_vehicle_catalog__catalog_id__official_manual_url_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Catalog Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficialManualUrlUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleCatalogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/vehicle-catalog/{catalog_id}/official-sources:
    get:
      tags:
      - admin-vehicle-catalog
      summary: List Official Sources
      operationId: list_official_sources_api_v1_admin_vehicle_catalog__catalog_id__official_sources_get
      security:
      - HTTPBearer: []
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Catalog Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficialSourceResponse'
                title: Response List Official Sources Api V1 Admin Vehicle Catalog  Catalog Id  Official Sources Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/vehicle-catalog/{catalog_id}/official-sources/sync:
    post:
      tags:
      - admin-vehicle-catalog
      summary: Sync Catalog Official Sources
      operationId: sync_catalog_official_sources_api_v1_admin_vehicle_catalog__catalog_id__official_sources_sync_post
      security:
      - HTTPBearer: []
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Catalog Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialSourceSyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/manuals:
    get:
      tags:
      - admin-manuals
      summary: List Manuals
      operationId: list_manuals_api_v1_admin_manuals_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ManualResponse'
                type: array
                title: Response List Manuals Api V1 Admin Manuals Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - admin-manuals
      summary: Create Manual
      operationId: create_manual_api_v1_admin_manuals_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/manuals/{manual_id}:
    patch:
      tags:
      - admin-manuals
      summary: Update Manual
      operationId: update_manual_api_v1_admin_manuals__manual_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: manual_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manual Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin-manuals
      summary: Archive Manual
      operationId: archive_manual_api_v1_admin_manuals__manual_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: manual_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manual Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/manuals/{manual_id}/upload-url:
    post:
      tags:
      - admin-manuals
      summary: Get Manual Upload Url
      operationId: get_manual_upload_url_api_v1_admin_manuals__manual_id__upload_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manual_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manual Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/manuals/{manual_id}/upload-complete:
    post:
      tags:
      - admin-manuals
      summary: Complete Manual Upload
      operationId: complete_manual_upload_api_v1_admin_manuals__manual_id__upload_complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manual_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manual Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCompleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/manuals/{manual_id}/prepare-rag-test:
    post:
      tags:
      - admin-manuals
      summary: Prepare Manual Rag Test
      description: Extract and chunk an uploaded PDF, then expose it to the local user RAG test.
      operationId: prepare_manual_rag_test_api_v1_admin_manuals__manual_id__prepare_rag_test_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manual_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manual Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualIndexResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/manuals/{manual_id}/rebuild-rag-index:
    post:
      tags:
      - admin-manuals
      summary: Rebuild Manual Rag Index
      description: Re-extract and re-embed an existing READY PDF after RAG changes.
      operationId: rebuild_manual_rag_index_api_v1_admin_manuals__manual_id__rebuild_rag_index_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manual_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manual Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualIndexResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AccessTokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: Bearer
        expires_in:
          type: integer
          title: Expires In
        user:
          $ref: '#/components/schemas/UserResponse'
      type: object
      required:
      - access_token
      - expires_in
      - user
      title: AccessTokenResponse
    AdminVehicleCatalogCreate:
      properties:
        manufacturer:
          type: string
          maxLength: 100
          minLength: 1
          title: Manufacturer
          default: HYUNDAI
        model_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Model Name
        model_year:
          type: integer
          maximum: 2100.0
          minimum: 1980.0
          title: Model Year
        official_manual_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Official Manual Url
      type: object
      required:
      - model_name
      - model_year
      title: AdminVehicleCatalogCreate
    AdminVehicleCatalogResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        manufacturer:
          type: string
          title: Manufacturer
        model_name:
          type: string
          title: Model Name
        model_year:
          type: integer
          title: Model Year
        display_name:
          type: string
          title: Display Name
        official_manual_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Official Manual Url
        status:
          $ref: '#/components/schemas/CatalogStatus'
        ready_manual_count:
          type: integer
          title: Ready Manual Count
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - manufacturer
      - model_name
      - model_year
      - display_name
      - status
      - created_at
      title: AdminVehicleCatalogResponse
    AdminVehicleCatalogUpdate:
      properties:
        manufacturer:
          type: string
          maxLength: 100
          minLength: 1
          title: Manufacturer
          default: HYUNDAI
        model_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Model Name
        model_year:
          type: integer
          maximum: 2100.0
          minimum: 1980.0
          title: Model Year
        official_manual_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Official Manual Url
      type: object
      required:
      - model_name
      - model_year
      title: AdminVehicleCatalogUpdate
    CatalogStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
      title: CatalogStatus
    ChatManualResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        manual_type:
          type: string
          title: Manual Type
        pdf_page_count:
          type: integer
          title: Pdf Page Count
        is_primary:
          type: boolean
          title: Is Primary
        download_available:
          type: boolean
          title: Download Available
          default: true
      type: object
      required:
      - id
      - title
      - manual_type
      - pdf_page_count
      - is_primary
      title: ChatManualResponse
    ChatMessageCreate:
      properties:
        content:
          type: string
          maxLength: 1000
          minLength: 1
          title: Content
        category:
          anyOf:
          - type: string
