  <rect x="28" y="164" width="334" height="276" rx="16" class="dangerbg" stroke="#B2412F" stroke-width="1"/><text x="50" y="202" class="danger title">운행을 계속하지 마세요.</text><text x="50" y="236" class="ink body">제동 이상은 안전에 큰 영향을 줄 수 있습니다.</text><text x="50" y="260" class="ink body">안전한 곳에 정차하고, 필요하면 긴급출동 또는</text><text x="50" y="284" class="ink body">정비소에 연락해 주세요.</text><rect x="50" y="312" width="250" height="42" rx="12" class="danger"/><text x="175" y="339" text-anchor="middle" fill="#FFF" class="body" font-family="Pretendard,Arial,sans-serif">긴급출동 / 정비 안내 보기</text><text x="50" y="403" class="muted small">정확한 진단이나 주행 지시는 제공하지 않습니다.</text>
