  <style>.bg{fill:#F4F7F8}.surface{fill:#FFF;stroke:#CAD4DA;stroke-width:1}.danger{fill:#B2412F}.dangerbg{fill:#F8E8E4}.ink{fill:#18232D;font-family:Pretendard,Arial,sans-serif}.muted{fill:#53616C;font-family:Pretendard,Arial,sans-serif}.small{font-size:13px}.body{font-size:15px}.title{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:700}</style>
