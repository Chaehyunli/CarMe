<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>.bg{fill:#F4F7F8}.surface{fill:#FFF;stroke:#CAD4DA;stroke-width:1}.sidebar{fill:#18232D}.ink{fill:#18232D;font-family:Pretendard,Arial,sans-serif}.muted{fill:#53616C;font-family:Pretendard,Arial,sans-serif}.light{fill:#DCE8EE;font-family:Pretendard,Arial,sans-serif}.accent{fill:#1F5E84}.success{fill:#277354}.warn{fill:#9A651D}.mutedbg{fill:#E8EEF1}.small{font-size:13px}.body{font-size:15px}.title{font-size:27px;font-weight:700}.label{font-size:15px;font-weight:700}</style>
  <rect class="bg" width="1200" height="800"/><rect class="sidebar" width="232" height="800"/>
  <text x="32" y="54" fill="#FFF" font-size="24" font-weight="700" font-family="Pretendard,Arial,sans-serif">CarMe</text><text x="32" y="78" class="light small">운영 관리</text>
  <rect x="16" y="122" width="200" height="46" rx="10" fill="#294957"/><text x="38" y="151" fill="#FFF" class="label" font-family="Pretendard,Arial,sans-serif">차량 카탈로그</text>
  <text x="38" y="208" class="light body">매뉴얼</text><text x="38" y="254" class="light body">적재 작업</text><text x="38" y="300" class="light body">감사 기록</text>
  <circle cx="44" cy="748" r="16" fill="#69B6DF"/><text x="72" y="744" fill="#FFF" class="small" font-family="Pretendard,Arial,sans-serif">관리자</text><text x="72" y="765" class="light small">운영 권한</text>
  <text x="280" y="67" class="ink title">차량 카탈로그</text><text x="280" y="94" class="muted body">사용자에게 제공할 차량과 적용 매뉴얼을 관리합니다.</text>
  <rect x="992" y="39" width="164" height="48" rx="12" class="accent"/><text x="1074" y="69" text-anchor="middle" fill="#FFF" class="label" font-family="Pretendard,Arial,sans-serif">차량 추가</text>
  <rect x="280" y="126" width="876" height="72" rx="14" class="surface"/><text x="304" y="169" class="muted body">차량명으로 검색</text><text x="1118" y="169" text-anchor="end" class="accent body">필터 ▾</text>
  <text x="280" y="242" class="muted small">총 3개 차량 카탈로그</text>
  <rect x="280" y="261" width="876" height="74" rx="12" class="surface"/><text x="306" y="292" class="ink label">아반떼 2025</text><text x="306" y="315" class="muted small">기본 매뉴얼 1개 · 마지막 수정 오늘</text><rect x="942" y="280" width="76" height="28" rx="14" fill="#E5F1E9"/><text x="980" y="299" text-anchor="middle" class="success small">공개됨</text><text x="1124" y="302" text-anchor="end" class="accent body">상세 ›</text>
  <rect x="280" y="349" width="876" height="74" rx="12" class="surface"/><text x="306" y="380" class="ink label">쏘나타 2026</text><text x="306" y="403" class="muted small">기본 매뉴얼 1개 · 품질 검토 대기</text><rect x="942" y="368" width="76" height="28" rx="14" fill="#F6EDD9"/><text x="980" y="387" text-anchor="middle" class="warn small">초안</text><text x="1124" y="390" text-anchor="end" class="accent body">상세 ›</text>
  <rect x="280" y="437" width="876" height="74" rx="12" class="surface"/><text x="306" y="468" class="ink label">코나 2024 하이브리드</text><text x="306" y="491" class="muted small">매뉴얼 2개 · 보관됨</text><rect x="942" y="456" width="76" height="28" rx="14" class="mutedbg"/><text x="980" y="475" text-anchor="middle" class="muted small">보관됨</text><text x="1124" y="478" text-anchor="end" class="accent body">상세 ›</text>
  <rect x="280" y="568" width="876" height="112" rx="14" fill="#E8EEF1"/><text x="306" y="605" class="ink label">표시 원칙</text><text x="306" y="632" class="muted body">내부 코드와 S3 저장 위치는 이 화면에 표시하지 않습니다.</text><text x="306" y="656" class="muted small">차량명, 연식, 매뉴얼 상태와 기본 문서 여부로 운영합니다.</text>
  <text x="280" y="754" class="muted small">09  관리자 · 차량 카탈로그</text>
</svg>
