<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>.bg{fill:#F4F7F8}.surface{fill:#FFF;stroke:#CAD4DA;stroke-width:1}.mutedbg{fill:#E8EEF1}.ink{fill:#18232D;font-family:Pretendard,Arial,sans-serif}.muted{fill:#53616C;font-family:Pretendard,Arial,sans-serif}.accent{fill:#1F5E84}.small{font-size:13px}.body{font-size:15px}.title{font-size:24px;font-weight:700}.label{font-size:15px;font-weight:700}</style>
  <rect class="bg" width="390" height="844"/><rect width="390" height="84" fill="#FFF"/><text x="28" y="49" class="ink title">상담을 종료할까요?</text>
  <rect x="28" y="132" width="334" height="276" rx="20" class="surface"/><circle cx="195" cy="204" r="38" class="mutedbg"/><text x="195" y="212" text-anchor="middle" class="accent" font-size="30" font-family="Arial,sans-serif">⌁</text><text x="195" y="278" text-anchor="middle" class="ink label">이 대화는 저장되지 않습니다</text><text x="195" y="307" text-anchor="middle" class="muted small">화면을 나가면 질문과 답변, 근거 카드가</text><text x="195" y="330" text-anchor="middle" class="muted small">이 기기와 서버 메모리에서 사라집니다.</text><text x="195" y="365" text-anchor="middle" class="muted small">다음 상담은 최신 매뉴얼로 새로 시작됩니다.</text>
  <rect x="28" y="448" width="334" height="54" rx="14" class="accent"/><text x="195" y="482" text-anchor="middle" fill="#FFF" class="body" font-family="Pretendard,Arial,sans-serif">상담 종료하기</text><rect x="28" y="518" width="334" height="54" rx="14" class="surface"/><text x="195" y="552" text-anchor="middle" class="ink body">계속 질문하기</text>
  <text x="28" y="836" class="muted small">08  단기 상담 세션 종료</text>
</svg>
