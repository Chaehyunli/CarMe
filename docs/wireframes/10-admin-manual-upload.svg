<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>.bg{fill:#F4F7F8}.surface{fill:#FFF;stroke:#CAD4DA;stroke-width:1}.sidebar{fill:#18232D}.ink{fill:#18232D;font-family:Pretendard,Arial,sans-serif}.muted{fill:#53616C;font-family:Pretendard,Arial,sans-serif}.light{fill:#DCE8EE;font-family:Pretendard,Arial,sans-serif}.accent{fill:#1F5E84}.mutedbg{fill:#E8EEF1}.small{font-size:13px}.body{font-size:15px}.title{font-size:27px;font-weight:700}.label{font-size:15px;font-weight:700}</style>
  <rect class="bg" width="1200" height="800"/><rect class="sidebar" width="232" height="800"/>
  <text x="32" y="54" fill="#FFF" font-size="24" font-weight="700" font-family="Pretendard,Arial,sans-serif">CarMe</text><text x="32" y="78" class="light small">운영 관리</text><text x="38" y="149" class="light body">차량 카탈로그</text><rect x="16" y="177" width="200" height="46" rx="10" fill="#294957"/><text x="38" y="206" fill="#FFF" class="label" font-family="Pretendard,Arial,sans-serif">매뉴얼</text><text x="38" y="263" class="light body">적재 작업</text>
  <text x="280" y="58" class="muted body">차량 카탈로그  /  아반떼 2025</text><text x="280" y="98" class="ink title">매뉴얼 추가</text><text x="280" y="125" class="muted body">이 차량에 적용할 문서를 만들고 PDF를 업로드합니다.</text>
  <rect x="280" y="158" width="560" height="68" rx="14" class="surface"/><text x="304" y="187" class="muted small">적용 차량</text><text x="304" y="210" class="ink label">아반떼 2025</text><text x="814" y="201" text-anchor="end" class="accent small">변경</text>
  <text x="280" y="269" class="ink label">문서 정보</text><rect x="280" y="287" width="560" height="59" rx="12" class="surface"/><text x="304" y="311" class="muted small">매뉴얼 제목</text><text x="304" y="333" class="ink body">아반떼 2025 취급설명서</text>
  <rect x="280" y="360" width="268" height="59" rx="12" class="surface"/><text x="304" y="384" class="muted small">문서 종류</text><text x="304" y="406" class="ink body">취급설명서 ▾</text><rect x="572" y="360" width="268" height="59" rx="12" class="surface"/><text x="596" y="384" class="muted small">언어</text><text x="596" y="406" class="ink body">한국어 ▾</text>
  <text x="280" y="462" class="ink label">PDF 파일</text><rect x="280" y="480" width="560" height="144" rx="14" fill="#FFF" stroke="#1F5E84" stroke-width="1.5" stroke-dasharray="5 5"/><text x="560" y="531" text-anchor="middle" class="accent" font-size="28" font-family="Arial,sans-serif">↑</text><text x="560" y="562" text-anchor="middle" class="ink label">PDF를 끌어 놓거나 선택하세요</text><text x="560" y="587" text-anchor="middle" class="muted small">PDF만 가능 · 업로드 후 파일 무결성을 다시 검증합니다.</text>
  <rect x="280" y="650" width="560" height="52" rx="13" class="accent"/><text x="560" y="683" text-anchor="middle" fill="#FFF" class="label" font-family="Pretendard,Arial,sans-serif">초안 생성 후 파일 선택</text>
  <rect x="872" y="158" width="284" height="326" rx="14" class="surface"/><text x="896" y="195" class="ink label">업로드 후 진행</text><circle cx="904" cy="232" r="10" class="accent"/><text x="928" y="237" class="ink body">파일 형식·크기·해시 확인</text><circle cx="904" cy="278" r="10" class="mutedbg"/><text x="928" y="283" class="muted body">페이지·목차·텍스트 추출</text><circle cx="904" cy="324" r="10" class="mutedbg"/><text x="928" y="329" class="muted body">청크·임베딩 생성</text><circle cx="904" cy="370" r="10" class="mutedbg"/><text x="928" y="375" class="muted body">READY 상태 확인</text><circle cx="904" cy="416" r="10" class="mutedbg"/><text x="928" y="421" class="muted body">공개 전 검토</text><text x="896" y="461" class="muted small">원본 저장 위치와 접근 URL은 표시하지 않습니다.</text>
  <text x="280" y="754" class="muted small">10  관리자 · 매뉴얼 업로드</text>
</svg>
