<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>.bg{fill:#F4F7F8}.surface{fill:#FFF;stroke:#CAD4DA;stroke-width:1}.sidebar{fill:#18232D}.ink{fill:#18232D;font-family:Pretendard,Arial,sans-serif}.muted{fill:#53616C;font-family:Pretendard,Arial,sans-serif}.light{fill:#DCE8EE;font-family:Pretendard,Arial,sans-serif}.accent{fill:#1F5E84}.success{fill:#277354}.successbg{fill:#E5F1E9}.mutedbg{fill:#E8EEF1}.small{font-size:13px}.body{font-size:15px}.title{font-size:27px;font-weight:700}.label{font-size:15px;font-weight:700}</style>
  <rect class="bg" width="1200" height="800"/><rect class="sidebar" width="232" height="800"/><text x="32" y="54" fill="#FFF" font-size="24" font-weight="700" font-family="Pretendard,Arial,sans-serif">CarMe</text><text x="32" y="78" class="light small">운영 관리</text><text x="38" y="149" class="light body">차량 카탈로그</text><text x="38" y="195" class="light body">매뉴얼</text><rect x="16" y="223" width="200" height="46" rx="10" fill="#294957"/><text x="38" y="252" fill="#FFF" class="label" font-family="Pretendard,Arial,sans-serif">적재 작업</text>
  <text x="280" y="58" class="muted body">차량 카탈로그  /  아반떼 2025</text><text x="280" y="98" class="ink title">공개 전 검토</text><text x="280" y="125" class="muted body">사용자에게 공개하기 전에 매뉴얼과 평가 결과를 확인합니다.</text>
  <rect x="280" y="158" width="876" height="92" rx="14" class="surface"/><text x="306" y="193" class="ink label">아반떼 2025</text><text x="306" y="218" class="muted body">현재 상태: 초안 · 기본 매뉴얼 1개 연결됨</text><rect x="1031" y="184" width="97" height="31" rx="15" class="successbg"/><text x="1080" y="204" text-anchor="middle" class="success small">공개 가능</text>
  <text x="280" y="294" class="ink label">공개 조건</text>
  <rect x="280" y="312" width="876" height="70" rx="12" class="surface"/><circle cx="310" cy="347" r="11" class="success"/><text x="310" y="352" text-anchor="middle" fill="#FFF" font-size="14" font-family="Arial,sans-serif">✓</text><text x="336" y="344" class="ink body">기본 매뉴얼이 연결되어 있습니다</text><text x="336" y="365" class="muted small">아반떼 2025 취급설명서 · READY</text>
  <rect x="280" y="396" width="876" height="70" rx="12" class="surface"/><circle cx="310" cy="431" r="11" class="success"/><text x="310" y="436" text-anchor="middle" fill="#FFF" font-size="14" font-family="Arial,sans-serif">✓</text><text x="336" y="428" class="ink body">파일과 페이지 추출 검증을 통과했습니다</text><text x="336" y="449" class="muted small">PDF 444쪽 · 추출 실패 페이지 0개</text>
  <rect x="280" y="480" width="876" height="70" rx="12" class="surface"/><circle cx="310" cy="515" r="11" class="success"/><text x="310" y="520" text-anchor="middle" fill="#FFF" font-size="14" font-family="Arial,sans-serif">✓</text><text x="336" y="512" class="ink body">초기 평가 질문을 확인했습니다</text><text x="336" y="533" class="muted small">근거 페이지 재현 · 안전 전환 · 인용 검증 확인</text>
  <rect x="280" y="602" width="876" height="76" rx="14" class="mutedbg"/><text x="306" y="632" class="ink label">공개 후 영향</text><text x="306" y="656" class="muted small">신규 사용자는 이 차량을 등록할 수 있고, 새 상담은 이 매뉴얼을 사용합니다.</text>
  <rect x="974" y="702" width="182" height="52" rx="13" class="accent"/><text x="1065" y="735" text-anchor="middle" fill="#FFF" class="label" font-family="Pretendard,Arial,sans-serif">사용자에게 공개</text><text x="280" y="754" class="muted small">11  관리자 · 공개 전 검토</text>
</svg>
