services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carme}
      POSTGRES_USER: ${POSTGRES_USER:-carme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carme_local_password}
    ports:
      # Keep the host's default PostgreSQL port free for local installations.
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carme -d carme"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 모델 파일은 Docker volume에만 보관한다. frontend는 이 포트에 직접 접근하지 않는다.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  minio_data:
  ollama_data:
