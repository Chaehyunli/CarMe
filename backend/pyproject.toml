[project]
name = "carme-api"
version = "0.1.0"
description = "CarMe vehicle-manual RAG API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "boto3>=1.35",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pymupdf>=1.25",
  "python-jose[cryptography]>=3.3",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
